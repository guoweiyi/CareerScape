name: CI and Deployment
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', '.github/PULL_REQUEST_TEMPLATE.md']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified image (default branch only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: Typecheck, tests and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/art/verify.mjs v1
      - run: node scripts/art/verify.mjs v2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            docs/screenshots/

  docker:
    name: Build, start and package Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build a local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: careerscape:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=careerscape-amd64
          cache-to: type=gha,mode=max,scope=careerscape-amd64
      - name: Verify health, native modules, assets and persistent saves
        run: node scripts/docker-smoke.mjs careerscape:ci
      - name: Package the tested image and deployment files
        run: node scripts/deploy/package-image.mjs careerscape:ci "$GITHUB_SHA" "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careerscape-image
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/image/*

  deploy:
    name: Upload verified image and deploy to server
    needs: [check, docker]
    if: >-
      github.repository == 'guoweiyi/CareerScape' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: careerscape-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: careerscape-image
          path: ${{ runner.temp }}/image
      - name: Check that this is still the default branch head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Superseded commit: server deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload and activate the verified release
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_PORT" && -n "$DEPLOY_USER" && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Missing deployment SSH secrets.' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid deployment SSH port.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/ssh/key"' EXIT
          opts=(-i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          cd "$RUNNER_TEMP/image"
          sha256sum --check careerscape-image.sha256
          remote="/opt/careerscape/releases/$GITHUB_SHA"
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$target" "mkdir -p '$remote'"
          for file in careerscape-image.tar.gz careerscape-image.sha256 release.json deploy.sh compose.production.yaml; do
            scp "${opts[@]}" -P "$DEPLOY_PORT" "$file" "$target:$remote/$file.part"
            ssh "${opts[@]}" -p "$DEPLOY_PORT" "$target" "mv '$remote/$file.part' '$remote/$file'"
          done
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$target" "bash '$remote/deploy.sh' '$GITHUB_SHA' '$GITHUB_RUN_NUMBER'"
          echo "Deployed commit $GITHUB_SHA to the server; image and HTTPS health verified." >> "$GITHUB_STEP_SUMMARY"
