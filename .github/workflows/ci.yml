name: P0 checks
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/art/verify.mjs v1
      - run: node scripts/art/verify.mjs v2
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
            docs/screenshots/
