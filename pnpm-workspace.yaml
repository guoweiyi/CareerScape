packages:
  - apps/*
allowBuilds:
  better-sqlite3: true
  argon2: true
  esbuild: true
  sharp: true
  '@parcel/watcher': true
  unrs-resolver: true
  vue-demi: true
  msw: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.106'
  - '@ai-sdk/openai@4.0.86'
  - '@ai-sdk/provider-utils@5.0.56'
  - '@ai-sdk/provider@4.0.24'
  - '@ai-sdk/vue@4.0.130'
  - ai@7.0.130
